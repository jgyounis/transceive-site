<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transceive</title>
  <meta name="description" content="Management consulting expertise spanning multiple industries and business functions.">
  <link rel="icon" href="logo.png">
  <style>
    @font-face {
      font-family: "Exo 2"; font-style: normal; font-weight: 600; font-display: swap;
      src: url("exo2-600.woff2") format("woff2");
    }
    :root { --bg: #0b1220; --text: #f3f4f6; --muted: #9ca3af; --line: #1f2937; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }
    main {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      max-width: 720px; width: 100%; margin: 0 auto; padding: 48px 16px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 88px; height: auto; flex: none; }
    h1 { font-family: "Exo 2", system-ui, sans-serif; font-size: 48px; font-weight: 600; letter-spacing: .01em; margin: 0; }
    .tagline { color: var(--muted); font-size: 18px; margin: 24px 0 0; text-wrap: balance; }
    footer {
      max-width: 720px; width: 100%; margin: 0 auto; padding: 16px;
      border-top: 1px solid var(--line); color: var(--muted); font-size: 14px;
    }
    @media (max-width: 480px) {
      .brand img { width: 64px; }
      h1 { font-size: 34px; }
      .tagline { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="logo.png" alt="Transceive logo">
      <h1>Transceive</h1>
    </div>
    <p class="tagline">Management consulting expertise spanning multiple industries and business functions.</p>
  </main>
  <footer>&copy; 2026 Transceive Company SRL</footer>
</body>
</html>
